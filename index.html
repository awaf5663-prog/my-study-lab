<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Study Lab</title>
<style>
:root{--bg:#fdf1f3;--fg:#4a2230;--mut:#a07785;--card:#fffafb;--line:#f0d3da;--acc:#b03a62;--acc2:#f8dde4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1218;--fg:#fbe8ee;--mut:#c79aa9;--card:#2c1a22;--line:#47283a;--acc:#f29bb5;--acc2:#3d2230;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1218;--fg:#fbe8ee;--mut:#c79aa9;--card:#2c1a22;--line:#47283a;--acc:#f29bb5;--acc2:#3d2230;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Georgia,"Times New Roman",serif}
#app{display:flex;min-height:100vh}
#side{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;overflow-x:auto}
#side button{flex:1;min-width:58px;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;padding:8px 2px;cursor:pointer}
#side button span{display:block;font-size:18px}
#side button.on{color:var(--acc);font-weight:700}
main{flex:1;max-width:680px;margin:0 auto;padding:16px 16px 100px;width:100%}
@media (min-width:760px){#side{position:sticky;top:0;height:100vh;width:190px;flex-direction:column;border:0;border-right:1px solid var(--line);padding:24px 8px;gap:4px}#side button{flex:none;text-align:left;font-size:15px;padding:10px 12px;border-radius:10px}#side button span{display:inline-block;width:24px;font-size:16px}#side button.on{background:var(--acc2)}main{padding-bottom:40px}}
h1{font-size:24px;margin:4px 0 2px}.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
h2{font-size:13px;margin:18px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.card,.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.card{cursor:pointer}.card b{display:block}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.st{text-align:center;font-size:12px;color:var(--mut);padding:10px 4px}.st b{display:block;font-size:22px;color:var(--fg)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--acc2);color:var(--acc);margin:4px 4px 0 0}
.dots{display:flex;gap:4px;margin-top:8px}.dots i{width:18px;height:6px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--acc)}
.bar{height:8px;border-radius:4px;background:var(--line);margin:8px 0}.bar i{display:block;height:100%;border-radius:4px;background:var(--acc)}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;margin-bottom:10px}textarea{min-height:110px;resize:vertical}
label{font-size:14px;color:var(--mut);display:block;margin-bottom:4px}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--acc);color:var(--bg);font:inherit;font-weight:700;cursor:pointer;margin-top:4px}.btn.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.steps{display:flex;gap:6px;margin:12px 0}.pill{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;font:inherit;font-size:13px;cursor:pointer}.pill.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.node{background:var(--acc2);border-radius:12px;padding:10px 12px;text-align:center}.arrow{text-align:center;color:var(--acc);line-height:1.2}
.chk{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:6px;color:var(--fg)}.chk input{width:20px;height:20px;margin:0}
.msg{padding:12px;border-radius:12px;background:var(--acc2);margin:10px 0}.empty{color:var(--mut);text-align:center;padding:24px 8px}
.pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;margin-bottom:10px}
.back{background:none;border:0;color:var(--acc);font:inherit;padding:0;margin-bottom:8px;cursor:pointer}
.big{font-size:40px;font-weight:700;text-align:center;margin:8px 0}.bl{display:inline-block;width:130px;margin:0 4px;padding:4px 8px}.ok{color:#2e8b57}.ko{color:#c0392b}
</style>
</head>
<body>
<div id="app"><div id="side"></div><main id="v"></main></div>
<script>
const K="msl-v2",INT=[1,2,7,21,45],DAY=864e5,MAT=["Droit","RH","Management","Relations internationales","Sciences politiques","Économie","Anglais","Culture générale","Informatique"];
const RULES="Règles : n’invente rien ; appuie-toi d’abord sur le texte du cours fourni ; distingue [COURS] et [EXTERNE] ; signale ce qui est absent ou incertain ; en droit, signale les différences entre juridictions (Sénégal, OHADA, France) et les évolutions possibles ; réponds en français.";
let D={C:[],N:[],X:[],P:{}},tab="home",open=null,oc=null,step=1,cmp=false,msg="",busy="",E=null,tm=null,PR=[],SM,CF=50,FL=null,MX=null,OS=null,RC=null,MR=null,SUB="method",CS="lib",CK=null,QR=null,KS="",AC={};
try{const r=localStorage.getItem(K)||localStorage.getItem("vcr-v1");if(r){const o=JSON.parse(r);if(Array.isArray(o))D.N=o;else D=Object.assign(D,o)}}catch(e){}
const $=s=>document.getElementById(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lines=t=>t.split("\n").map(s=>s.trim()).filter(Boolean);
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const gN=id=>D.N.find(n=>n.id===id),gC=id=>D.C.find(c=>c.id===id),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
async function ai(p,json){
 if(!SM){try{SM=await claude.use("sample")}catch(e){}}
 if(!SM)throw new Error("IA indisponible ici : ouvre la page depuis claude.ai");
 return json?await SM.json(p,{cache:false}):(await SM(p,{cache:false})).text}
async function run(l,fn){busy=l;msg="";render();try{await fn()}catch(e){msg="Erreur : "+(e.message||e.code||"échec")}busy="";render()}
const NAV=[["home","Accueil","⌂"],["courses","Cours","▤"],["learn","Apprendre","◉"],["exam","Examen","✎"],["lab","Atelier","✦"],["codes","Codes","⚖"],["prog","Progrès","▲"],["plan","Planning","◷"]];
function go(t){tab=t;open=null;oc=null;msg="";cmp=false;render()}
function openN(id,s){tab="learn";open=id;step=s||1;cmp=false;msg="";render();scrollTo(0,0)}
function render(){
 $("side").innerHTML=NAV.map(([k,l,i])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join("");
 $("v").innerHTML=(busy?`<div class="msg">⏳ ${esc(busy)}…</div>`:"")+(msg?`<div class="msg">${esc(msg)}</div>`:"")+({home,courses,learn,exam,lab,codes,prog,plan})[tab]();
 if(tab==="exam"&&E&&!E.res){clearInterval(tm);tm=setInterval(()=>{const e=$("tmr");if(!e||!E||E.res){clearInterval(tm);return}const s=Math.max(0,E.d*60-Math.floor((Date.now()-E.s)/1000));e.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")},1000)}}
function card(n){const d=[0,1,2,3,4].map(i=>`<i class="${n.done&&i<=n.box?"on":""}"></i>`).join("");return `<div class="card" onclick="openN('${n.id}')"><b>${esc(n.t)}</b><span class="tag">${esc(n.m)}</span><div class="dots">${d}</div></div>`}
function home(){const now=Date.now(),due=D.N.filter(n=>n.done&&n.due<=now),wip=D.N.filter(n=>!n.done),ok=D.N.filter(n=>n.done&&n.box>=3).length;
 return `<h1>My Study Lab</h1><p class="sub">Visualiser · Comprendre · Restituer</p><div class="grid"><div class="st"><b>${D.C.length}</b>cours</div><div class="st"><b>${D.N.length}</b>notions</div><div class="st"><b>${ok}</b>ancrées</div><div class="st"><b>${due.length}</b>à restituer</div></div>`+
 (D.N.length?`<h2>À restituer aujourd’hui</h2>${due.map(card).join("")||'<div class="empty">Rien d’urgent.</div>'}${wip.length?`<h2>En cours (V → C → R)</h2>${wip.map(card).join("")}`:""}`:`<div class="empty">Commence par importer un cours.<br><br><button class="btn" onclick="go('courses')">Importer un cours</button></div>`)}
function courses(){
 if(oc){const c=gC(oc),ns=D.N.filter(n=>n.cid===c.id);
  return `<button class="back" onclick="oc=null;render()">← Cours</button><h1>${esc(c.t)}</h1><span class="tag">${esc(c.m)}</span><span class="tag">${esc(c.sem)} · ${esc(c.chap)}</span><p class="sub">${c.txt.length} caractères importés</p><button class="btn" onclick="extract('${c.id}')">Extraire les notions avec l’IA</button><button class="btn alt" onclick="chkFrom('${c.id}')">Vérifier la conformité aux codes</button><h2>Notions (${ns.length})</h2>${ns.map(card).join("")||'<div class="empty">Aucune notion extraite.</div>'}<h2>Texte</h2><div class="pre">${esc(c.txt.slice(0,2500))}${c.txt.length>2500?"…":""}</div><button class="btn alt" onclick="delC('${c.id}')">Supprimer ce cours</button>`}
 return `<h1>Mes cours</h1>`+D.C.map(c=>`<div class="card" onclick="oc='${c.id}';render()"><b>${esc(c.t)}</b><span class="tag">${esc(c.m)}</span><span class="tag">${esc(c.sem)} · ${esc(c.chap)}</span></div>`).join("")+
 `<h2>Importer un cours</h2><input id="ct" placeholder="Titre du cours"><input id="cm" list="ml" placeholder="Matière"><datalist id="ml">${MAT.map(m=>`<option>${m}</option>`).join("")}</datalist><input id="cs" placeholder="Semestre (ex. S5)"><input id="cc" placeholder="Chapitre"><label>Fichier texte (.txt, .md) ou texte collé</label><input type="file" id="cf" accept=".txt,.md" onchange="readF(this)"><textarea id="cx" placeholder="Colle ici ton cours (articles de loi, références…)"></textarea><button class="btn" onclick="addC()">Enregistrer le cours</button><p class="sub">PDF, Word, PowerPoint : copie le texte pour l’instant.</p>`}
function readF(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("cx").value=r.result;if(!$("ct").value)$("ct").value=f.name.replace(/\.\w+$/,"")};r.readAsText(f)}
function addC(){const c={id:uid(),t:$("ct").value.trim(),m:$("cm").value.trim()||"Autre",sem:$("cs").value.trim()||"—",chap:$("cc").value.trim()||"—",txt:$("cx").value.trim()};
 if(!c.t||c.txt.length<30){msg="Titre et texte (30 caractères minimum) requis.";render();return}D.C.unshift(c);sv();oc=c.id;msg="";render()}
function delC(id){D.C=D.C.filter(c=>c.id!==id);sv();oc=null;render()}
function extract(id){const c=gC(id);run("Extraction des notions",async()=>{
 const r=await ai(`${RULES}\nExtrais du cours ci-dessous 4 à 8 notions essentielles. Réponds uniquement en JSON : [{"t":"titre","el":["3 à 7 éléments clés dans l’ordre logique"],"ref":"articles ou sources cités dans le cours, sinon vide"}].\nMatière : ${c.m}\nCOURS :\n${c.txt.slice(0,12000)}`,true);
 (Array.isArray(r)?r:[]).forEach(x=>{if(x.t&&x.el&&x.el.length>1)D.N.unshift({id:uid(),cid:c.id,t:x.t,m:c.m,el:x.el.map(String),ref:x.ref||"",ex:"",box:0,done:false,due:0,h:[]})});
 sv();msg="Notions extraites. Vérifie-les avant de les apprendre."})}
function learn(){
 if(open)return detail(gN(open));
 return `<h1>Apprendre</h1>`+(D.N.length?[...new Set(D.N.map(n=>n.m))].map(m=>`<h2>${esc(m)}</h2>${D.N.filter(n=>n.m===m).map(card).join("")}`).join(""):'<div class="empty">Importe un cours ou crée une notion.</div>')+
 `<h2>Nouvelle notion</h2><input id="t" placeholder="Ex. : Cycle de recrutement"><input id="m" list="ml2" placeholder="Matière"><datalist id="ml2">${MAT.map(m=>`<option>${m}</option>`).join("")}</datalist><label>Éléments clés, un par ligne, dans l’ordre logique</label><textarea id="e"></textarea><button class="btn" onclick="add()">Créer et passer à Comprendre</button>`}
function add(){const t=$("t").value.trim(),el=lines($("e").value);if(!t||el.length<2){msg="Titre et 2 éléments clés minimum.";render();return}
 const n={id:uid(),t,m:$("m").value.trim()||"Autre",el,ref:"",ex:"",box:0,done:false,due:0,h:[]};D.N.unshift(n);sv();openN(n.id,2)}
function detail(n){
 const st=[1,2,3].map(i=>`<button class="pill ${step===i?"on":""}" onclick="step=${i};cmp=false;msg='';render()">${["V Visualiser","C Comprendre","R Restituer"][i-1]}</button>`).join("");let b="";
 if(step===1)b=`<p class="sub">Dessine la notion sur papier, puis vérifie la chaîne logique.</p>${n.el.map(e=>`<div class="node">${esc(e)}</div>`).join('<div class="arrow">↓</div>')}${n.ref?`<h2>Références</h2><div class="pre">${esc(n.ref)}</div>`:""}<h2>Modifier les éléments</h2><textarea id="el">${esc(n.el.join("\n"))}</textarea><button class="btn alt" onclick="upd()">Enregistrer</button><button class="btn" onclick="step=2;render()">Passer à Comprendre</button>`;
 if(step===2)b=`<button class="btn alt" onclick="teach('${n.id}')">Demander au professeur (IA)</button>${n.prof?`<div class="pre">${esc(n.prof)}</div>`:""}<p class="sub">Puis explique la notion avec tes mots, sans notes.</p><textarea id="ex" placeholder="Avec mes mots…">${esc(n.ex)}</textarea><button class="btn alt" onclick="saveEx()">Enregistrer</button><button class="btn" onclick="saveEx();step=3;render()">Passer à Restituer</button>`;
 if(step===3)b=`<p class="sub">Feuille blanche : écris de mémoire avant de voir la réponse.</p><textarea id="rs" placeholder="De mémoire…"></textarea>${cmp?`<p class="sub">Confiance annoncée : ${CF} %</p>`:`<label>Ta confiance avant de comparer : <b id="cfv">50</b> %</label><input type="range" id="cf2" min="0" max="100" value="50" oninput="$('cfv').textContent=this.value">`}${cmp?`<h2>Coche ce que tu avais</h2>${n.el.map(e=>`<label class="chk"><input type="checkbox" class="c"> ${esc(e)}</label>`).join("")}<button class="btn" onclick="valid()">Valider ma restitution</button>`:`<button class="btn" onclick="if($('rs').value.trim().length<5){msg='Essaie d’abord de restituer.';render();return}CF=+$('cf2').value;cmp=true;render()">Comparer avec les éléments clés</button>`}`;
 return `<button class="back" onclick="open=null;render()">← Retour</button><h1>${esc(n.t)}</h1><span class="tag">${esc(n.m)}</span><div class="steps">${st}</div>${b}<h2>Gestion</h2><button class="btn alt" onclick="delN('${n.id}')">Supprimer cette notion</button>`}
function upd(){const n=gN(open),l=lines($("el").value);if(l.length<2)return;n.el=l;sv();msg="Éléments enregistrés.";render()}
function saveEx(){const n=gN(open),x=$("ex");if(x){n.ex=x.value;sv()}}
function teach(id){const n=gN(id),c=n.cid&&gC(n.cid);run("Le professeur prépare l’explication",async()=>{
 n.prof=await ai(`${RULES}\nTu es un professeur exigeant et bienveillant. Explique la notion « ${n.t} » (matière : ${n.m}) à une étudiante de licence en 6 parties titrées : 1 Définition simple ; 2 Explication approfondie ; 3 Exemple de la vie réelle ; 4 Analogie ; 5 Prérequis à vérifier ; 6 Question de vérification (sans la réponse).\nÉléments clés : ${n.el.join(" ; ")}\n${c?"COURS :\n"+c.txt.slice(0,8000):"Aucun cours importé : tout est [EXTERNE]."}`);sv()})}
function valid(){const n=gN(open),c=[...document.querySelectorAll(".c")],s=c.filter(x=>x.checked).length/c.length;
 n.box=s>=.8?Math.min(n.box+1,4):0;n.done=true;n.due=Date.now()+INT[n.box]*DAY;n.h.push({d:Date.now(),s:Math.round(s*100),cf:CF});sv();
 msg=s>=.8?`Score ${Math.round(s*100)} %. Prochaine restitution dans ${INT[n.box]} jour(s). Une notion n’est ancrée qu’après 3 réussites consécutives.`:`Score ${Math.round(s*100)} %. Repasse par V et C, puis restitue demain.`;msg+=` Confiance annoncée : ${CF} % pour ${Math.round(s*100)} % obtenus.`;cmp=false;render()}
function delN(id){D.N=D.N.filter(n=>n.id!==id);sv();open=null;render()}
function exam(){
 if(!E)return `<h1>Examen blanc</h1>`+(D.C.length?`<label>Cours à évaluer</label><select id="ec">${D.C.map(c=>`<option value="${c.id}">${esc(c.t)} (${esc(c.m)})</option>`).join("")}</select><label>Durée (minutes)</label><input id="ed" type="number" value="30"><button class="btn" onclick="genExam()">Générer l’examen</button>`:'<div class="empty">Importe d’abord un cours.</div>')+(D.X.length?`<h2>Historique</h2>${D.X.slice(0,8).map(x=>`<div class="card" style="cursor:default">${esc(x.t)} <b>${x.note}/20</b><span class="sub">${new Date(x.d).toLocaleDateString("fr-FR")}</span></div>`).join("")}`:"");
 if(E.res){const r=E.res;return `<h1>Résultat</h1><div class="big">${r.note}/20</div>${E.q.map((q,i)=>`<div class="card" style="cursor:default"><b>Q${i+1} (${q.pts} pts)</b>${esc(q.q)}<div class="sub">${esc(((r.d||[])[i]||{}).justif||"")}</div></div>`).join("")}<h2>Erreurs récurrentes</h2><div class="pre">${esc((r.erreurs||[]).join("\n")||"—")}</div><h2>Remédiation</h2><div class="pre">${esc((r.remed||[]).join("\n")||"—")}</div><button class="btn" onclick="E=null;render()">Nouvel examen</button>`}
 return `<h1>${esc(E.t)}</h1><div class="big" id="tmr">${E.d}:00</div><p class="sub">Sans accès au cours. Note sur 20 selon la grille.</p>${E.q.map((q,i)=>`<label><b>Q${i+1} (${q.pts} pts)</b> ${esc(q.q)}</label><textarea id="a${i}"></textarea>`).join("")}<button class="btn" onclick="correct()">Rendre la copie</button>`}
function genExam(){const c=gC($("ec").value),d=+$("ed").value||30;run("Génération de l’examen",async()=>{
 const r=await ai(`${RULES}\nCrée un examen blanc de ${d} minutes sur 20 points pour la matière « ${c.m} » (droit : cas pratique ou commentaire ; RH : étude de cas ; sinon réflexion et application), portant uniquement sur le cours. Réponds en JSON : {"q":[{"q":"énoncé","pts":nombre,"crit":["critères de correction précis"]}]} ; somme des pts = 20.\nATTENDUS DU PROFESSEUR : ${rl(c.m)||"aucun"}\nCOURS :\n${c.txt.slice(0,10000)}`,true);
 if(!r.q||!r.q.length)throw new Error("examen invalide");E={t:c.t,m:c.m,q:r.q,d,s:Date.now(),a:[]}})}
function correct(){E.a=E.q.map((_,i)=>$("a"+i).value);run("Correction",async()=>{
 const r=await ai(`${RULES}\nCorrige strictement selon les critères, sans points hors grille ; une réponse vide vaut 0. JSON : {"d":[{"pts":nombre obtenu,"justif":"justification courte"}],"erreurs":["erreurs récurrentes"],"remed":["actions de remédiation concrètes"]}.\nSUJET ET GRILLE : ${JSON.stringify(E.q)}\nRÉPONSES : ${JSON.stringify(E.a)}`,true);
 const note=Math.round(E.q.reduce((s,q,i)=>s+Math.min(+q.pts||0,Math.max(0,+((r.d||[])[i]||{}).pts||0)),0)*10)/10;
 E.res=Object.assign({},r,{note});D.X.unshift({d:Date.now(),t:E.t,m:E.m,note});sv()})}
function prog(){const ms=[...new Set([...D.N,...D.C].map(x=>x.m))];if(!ms.length)return '<h1>Progrès</h1><div class="empty">Aucune donnée pour l’instant.</div>';
 return `<h1>Progrès</h1>`+ms.map(m=>{const ns=D.N.filter(n=>n.m===m),ok=ns.filter(n=>n.done&&n.box>=3).length,p=ns.length?Math.round(ok/ns.length*100):0,xs=D.X.filter(x=>x.m===m),avg=xs.length?(xs.reduce((s,x)=>s+x.note,0)/xs.length).toFixed(1):"—";
 return `<div class="card" style="cursor:default"><b>${esc(m)}</b><div class="bar"><i style="width:${p}%"></i></div><span class="sub">${ok}/${ns.length} notions ancrées (${p} %) · moyenne aux examens : ${avg}/20</span></div>`}).join("")+calib()+'<p class="sub">« Ancrée » = 3 restitutions réussies consécutives et espacées, jamais un seul exercice.</p>'}
function setP(i,v){D.P[PR[i].m]=v;sv();render()}
function plan(){const ms=[...new Set([...D.N,...D.C].map(x=>x.m))];if(!ms.length)return '<h1>Planning</h1><div class="empty">Importe un cours pour planifier.</div>';
 PR=ms.map(m=>{const ns=D.N.filter(n=>n.m===m),ok=ns.filter(n=>n.done&&n.box>=3).length,dt=D.P[m],days=dt?Math.ceil((new Date(dt)-Date.now())/DAY):null,gap=ns.length?1-ok/ns.length:1;
  return{m,dt,days,due:ns.filter(n=>n.done&&n.due<=Date.now()).length,wip:ns.filter(n=>!n.done).length,pr:gap/Math.max(days==null?30:days,1)}}).sort((a,b)=>b.pr-a.pr);
 return `<h1>Planning</h1><p class="sub">Séances courtes de 25 minutes, classées par priorité.</p>`+PR.map((r,i)=>`<div class="card" style="cursor:default"><b>${i+1}. ${esc(r.m)}</b><span class="sub">${r.due} à restituer · ${r.wip} à terminer${r.days!=null?` · examen dans ${r.days} j`:""}</span><label>Date d’examen</label><input type="date" value="${r.dt||""}" onchange="setP(${i},this.value)"></div>`).join("")}
const nz=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g,"").trim();
const rl=m=>(D.R||[]).filter(r=>r.m.toLowerCase()===String(m).toLowerCase()).map(r=>r.txt).join("\n---\n").slice(0,3000);
const DL=`<datalist id="ml3">${MAT.map(m=>`<option>${m}</option>`).join("")}</datalist>`;
function calib(){const h=D.N.flatMap(n=>n.h.filter(x=>x.cf!=null));if(!h.length)return "";const g=Math.round(h.reduce((s,x)=>s+x.cf-x.s,0)/h.length);
 return `<div class="card" style="cursor:default"><b>Calibrage de ta confiance</b><span class="sub">Écart moyen entre ta confiance et ton score réel : ${g>0?"+":""}${g} points. ${g>10?"Tu te surestimes : méfie-toi de la familiarité.":g<-10?"Tu te sous-estimes : tu en sais plus que tu ne crois.":"Ton estimation est juste."}</span></div>`}
function lab(){const t=[["method","Méthode"],["cloze","Trous"],["mix","Mixte"],["oral","Oral"],["rules","Profs"]];
 return `<h1>Atelier</h1><div class="steps">${t.map(([k,l])=>`<button class="pill ${SUB===k?"on":""}" onclick="SUB='${k}';msg='';render()">${l}</button>`).join("")}</div>`+({method:vMethod,cloze:vCloze,mix:vMix,oral:vOral,rules:vRules})[SUB]()}
function vMethod(){
 if(MR){const r=MR;return `<div class="big">${r.note}/20</div><div class="card" style="cursor:default"><b>Fond ${r.f}/12</b>${esc(r.jf)}</div><div class="card" style="cursor:default"><b>Méthode et structure ${r.m}/5</b>${esc(r.jm)}</div><div class="card" style="cursor:default"><b>Expression ${r.e}/3</b>${esc(r.je)}</div><h2>Éléments attendus absents</h2><div class="pre">${esc(r.manques.join("\n")||"—")}</div><h2>Conseils</h2><div class="pre">${esc(r.conseils.join("\n")||"—")}</div><button class="btn" onclick="MR=null;render()">Nouvelle copie</button>`}
 return `<p class="sub">Colle l’énoncé et ta réponse. Note sur 20 : fond 12, méthode 5, expression 3.</p><input id="mm" list="ml3" placeholder="Matière">${DL}<select id="mt"><option>Cas pratique</option><option>Commentaire d’arrêt</option><option>Dissertation</option><option>Note de synthèse</option><option>Étude de cas RH</option><option>Autre</option></select><label>Énoncé</label><textarea id="me"></textarea><label>Ta réponse</label><textarea id="mr" style="min-height:200px"></textarea><button class="btn" onclick="method()">Corriger ma méthode</button>`}
function method(){const m=$("mm").value.trim()||"Autre",t=$("mt").value,e=$("me").value,a=$("mr").value;
 if(a.trim().length<40){msg="Écris une vraie réponse (40 caractères minimum).";render();return}
 run("Correction de ta méthode",async()=>{const r=await ai(`${RULES}\nTu es un correcteur universitaire rigoureux. Évalue cette copie (${t}, matière ${m}) selon la grille : fond (max 12), méthode et structure (max 5 ; droit : problème de droit, règle avec articles, application, conclusion ; RH : diagnostic, analyse, recommandation, plan d’action), expression (max 3). Ne note que d’après le texte fourni. JSON : {"f":nombre,"jf":"justification","m":nombre,"jm":"justification","e":nombre,"je":"justification","manques":["éléments attendus absents"],"conseils":["actions précises"]}.\nATTENDUS DU PROFESSEUR : ${rl(m)||"aucun"}\nÉNONCÉ : ${e}\nCOPIE : ${a}`,true);
 const c=(x,mx)=>Math.min(mx,Math.max(0,+x||0));MR={f:c(r.f,12),m:c(r.m,5),e:c(r.e,3),jf:r.jf||"",jm:r.jm||"",je:r.je||"",manques:r.manques||[],conseils:r.conseils||[]};
 MR.note=Math.round((MR.f+MR.m+MR.e)*10)/10;D.X.unshift({d:Date.now(),t:"Méthode : "+t,m,note:MR.note});sv()})}
function vCloze(){
 if(FL)return FL.items.map((it,i)=>{const p=it.texte.split("___");return `<div class="card" style="cursor:default">${p.map((s,j)=>esc(s)+(j<p.length-1?`<input class="bl" data-i="${i}" data-j="${j}" ${FL.done?`value="${esc(FL.a[i][j])}" disabled`:""}>${FL.done?`<b class="${FL.ok[i][j]?"ok":"ko"}">${FL.ok[i][j]?"✓":"→ "+esc(it.rep[j])}</b>`:""}`:"")).join("")}</div>`}).join("")+(FL.done?`<div class="msg">Score : ${FL.s} %</div><button class="btn" onclick="FL=null;render()">Nouveaux textes</button>`:`<button class="btn" onclick="chkCloze()">Vérifier</button>`);
 return D.C.length?`<p class="sub">Apprends mot pour mot les définitions et articles de ton cours.</p><select id="fc">${D.C.map(c=>`<option value="${c.id}">${esc(c.t)}</option>`).join("")}</select><button class="btn" onclick="genCloze()">Générer des textes à trous</button>`:'<div class="empty">Importe d’abord un cours.</div>'}
function genCloze(){const c=gC($("fc").value);run("Création des textes à trous",async()=>{
 const r=await ai(`${RULES}\nChoisis dans le cours 5 passages essentiels (définitions, articles, règles), copiés tels quels. Dans chacun, remplace 1 à 3 mots clés par ___ . JSON : [{"texte":"passage avec ___","rep":["mots masqués, dans l’ordre"]}] ; le nombre de ___ égale le nombre de réponses.\nCOURS :\n${c.txt.slice(0,10000)}`,true);
 const it=(Array.isArray(r)?r:[]).filter(x=>x.texte&&x.rep&&x.texte.split("___").length-1===x.rep.length);if(!it.length)throw new Error("aucun passage exploitable");FL={items:it,done:false}})}
function chkCloze(){const a=FL.items.map(it=>it.rep.map(()=>""));document.querySelectorAll(".bl").forEach(e=>{a[+e.dataset.i][+e.dataset.j]=e.value});let t=0,g=0;
 FL.ok=FL.items.map((it,i)=>it.rep.map((w,j)=>{const k=nz(a[i][j])===nz(w);t++;if(k)g++;return k}));FL.a=a;FL.s=Math.round(g/t*100);FL.done=true;render()}
function vMix(){
 if(!MX)return `<p class="sub">Séance mélangée : des notions de plusieurs matières à la suite, sans bloc par matière. Plus exigeant, mais la mémoire retient mieux.</p><button class="btn" onclick="mixStart()">Démarrer (8 notions maximum)</button>`;
 if(MX.i>=MX.q.length)return `<div class="msg">Séance terminée : ${MX.q.length} notions travaillées.</div><button class="btn" onclick="MX=null;render()">Retour</button>`;
 const n=gN(MX.q[MX.i]);
 return `<p class="sub">${MX.i+1} / ${MX.q.length}</p><div class="card" style="cursor:default"><b>${esc(n.t)}</b><span class="tag">${esc(n.m)}</span></div>`+(MX.show?`<div class="pre">${esc(MX.txt)}</div>${n.el.map(e=>`<div class="node">${esc(e)}</div>`).join('<div class="arrow">↓</div>')}<button class="btn" onclick="mixRate(100)">Je l’avais</button><button class="btn alt" onclick="mixRate(60)">Partiellement</button><button class="btn alt" onclick="mixRate(0)">Raté</button>`:`<textarea id="mx" placeholder="Restitue de mémoire…"></textarea><button class="btn" onclick="if($('mx').value.trim().length<5){msg='Essaie d’abord de restituer.';render();return}MX.txt=$('mx').value;MX.show=true;render()">Voir les éléments clés</button>`)}
function mixStart(){const p=D.N.filter(n=>n.done).sort((a,b)=>a.due-b.due).slice(0,8),g={};p.forEach(n=>(g[n.m]=g[n.m]||[]).push(n.id));const q=[];let k=1;
 while(k){k=0;Object.values(g).forEach(l=>{if(l.length){q.push(l.shift());k=1}})}
 if(!q.length){msg="Termine d’abord au moins une notion (V, C, R).";render();return}MX={q,i:0,show:false,txt:""};render()}
function mixRate(s){const n=gN(MX.q[MX.i]);n.box=s>=80?Math.min(n.box+1,4):0;n.due=Date.now()+INT[n.box]*DAY;n.h.push({d:Date.now(),s});sv();MX.i++;MX.show=false;render()}
function vOral(){
 if(OS)return `<div class="big">${OS.note}/20</div>${[["Clarté",OS.c,OS.jc],["Rigueur",OS.r,OS.jr],["Structure",OS.s,OS.js],["Vocabulaire",OS.v,OS.jv]].map(([l,p,j])=>`<div class="card" style="cursor:default"><b>${l} ${p}/5</b>${esc(j)}</div>`).join("")}<h2>Conseils</h2><div class="pre">${esc(OS.conseils.join("\n")||"—")}</div><button class="btn" onclick="OS=null;render()">Nouvel oral</button>`;
 return `<p class="sub">Parle à voix haute sur un sujet : l’outil transcrit, puis note clarté, rigueur, structure et vocabulaire (/5 chacun).</p><input id="osj" placeholder="Sujet (ex. : le principe de souveraineté)"><button class="btn alt" id="dbt" onclick="dict()">🎙 Dicter</button><textarea id="os" style="min-height:180px" placeholder="La transcription apparaît ici. Tu peux aussi écrire ou utiliser le micro de ton clavier."></textarea><button class="btn" onclick="oral()">Évaluer mon oral</button>`}
function dict(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(RC){try{RC.stop()}catch(e){}RC=null;$("dbt").textContent="🎙 Dicter";return}
 if(!R){msg="Dictée indisponible ici : utilise le micro de ton clavier.";render();return}
 const r=new R();r.lang="fr-FR";r.continuous=true;r.interimResults=false;
 r.onresult=e=>{let t="";for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript+" ";$("os").value+=t};
 r.onend=()=>{RC=null;const b=$("dbt");if(b)b.textContent="🎙 Dicter"};r.onerror=()=>{RC=null;const b=$("dbt");if(b)b.textContent="🎙 Dicter (micro indisponible)"};
 try{r.start();RC=r;$("dbt").textContent="⏹ Arrêter"}catch(e){msg="Micro indisponible.";render()}}
function oral(){const s=$("osj").value.trim(),t=$("os").value.trim();if(t.length<60){msg="Il faut au moins 60 caractères.";render();return}
 if(RC){try{RC.stop()}catch(e){}RC=null}
 run("Évaluation de l’oral",async()=>{const r=await ai(`${RULES}\nÉvalue cet oral transcrit sur le sujet « ${s||"libre"} » : clarté, rigueur, structure, vocabulaire, chacun sur 5. Ne juge que la transcription (ignore les erreurs évidentes de transcription). JSON : {"c":n,"jc":"","r":n,"jr":"","s":n,"js":"","v":n,"jv":"","conseils":[""]}.\nTRANSCRIPTION : ${t.slice(0,6000)}`,true);
 const c=x=>Math.min(5,Math.max(0,+x||0));OS={c:c(r.c),r:c(r.r),s:c(r.s),v:c(r.v),jc:r.jc||"",jr:r.jr||"",js:r.js||"",jv:r.jv||"",conseils:r.conseils||[]};
 OS.note=OS.c+OS.r+OS.s+OS.v;D.X.unshift({d:Date.now(),t:"Oral : "+(s||"libre"),m:"Oral",note:OS.note});sv()})}
function vRules(){return `<p class="sub">Enregistre les attendus, barèmes et annales de tes professeurs. Les examens blancs et la correction de méthode s’y alignent.</p>`+(D.R||[]).map(r=>`<div class="card" style="cursor:default"><b>${esc(r.m)}</b><div class="pre">${esc(r.txt.slice(0,300))}${r.txt.length>300?"…":""}</div><button class="btn alt" onclick="delR('${r.id}')">Supprimer</button></div>`).join("")+`<input id="rm" list="ml3" placeholder="Matière">${DL}<textarea id="rt" placeholder="Barème, attendus, consignes, annales…"></textarea><button class="btn" onclick="addR()">Enregistrer</button>`}
function addR(){const m=$("rm").value.trim()||"Autre",t=$("rt").value.trim();if(t.length<10){msg="Texte trop court.";render();return}(D.R=D.R||[]).unshift({id:uid(),m,txt:t});sv();render()}
function delR(id){D.R=D.R.filter(r=>r.id!==id);sv();render()}

const L=()=>D.L||(D.L=[]);
function parse(t){const re=/^[ \t]*(?:\*\*)?(?:Article|Art\.?)\s+((?:[LRD]\s?\.?\s?)?\d[\w\-\.]*)/gim,pos=[];let m;
 while(m=re.exec(t))pos.push({k:m[1],i:m.index});
 let a=pos.map((p,j)=>({id:p.k.replace(/\.$/,""),key:p.k.toLowerCase().replace(/[\s\.]/g,""),txt:t.slice(p.i,j+1<pos.length?pos[j+1].i:p.i+3000).slice(0,3000)}));
 if(a.length<3){a=[];for(let i=0,n=1;i<t.length;i+=1500,n++)a.push({id:"§"+n,key:"§"+n,txt:t.slice(i,i+1500)})}
 a.forEach(x=>x.nz=nz(x.txt));return a}
function arts(c){return AC[c.id]||(AC[c.id]=parse(c.txt))}
function lookup(ref,codes){const k=ref.toLowerCase().replace(/[\s\.]/g,""),s=x=>x.replace(/^[lrd]/,""),out=[];
 codes.forEach(c=>{const A=arts(c),f=A.find(a=>a.key===k)||A.find(a=>s(a.key)===s(k));if(f)out.push({c,a:f})});return out}
function kw(words,codes,n){const w=words.map(nz).filter(x=>x.length>2),r=[];
 codes.forEach(c=>arts(c).forEach(a=>{let s=0;w.forEach(x=>{if(a.nz.includes(x))s++});if(s)r.push({c,a,s})}));return r.sort((x,y)=>y.s-x.s).slice(0,n)}
function codes(){const t=[["lib","Bibliothèque"],["check","Vérifier"]];
 return `<h1>Codes et textes</h1><div class="steps">${t.map(([k,l])=>`<button class="pill ${CS===k?"on":""}" onclick="CS='${k}';msg='';render()">${l}</button>`).join("")}</div>`+(CS==="lib"?vLib():vCheck())}
function vLib(){
 return (L().map(c=>`<div class="card" style="cursor:default"><b>${esc(c.t)}</b><span class="tag">${esc(c.j)}</span><span class="tag">${esc(c.v||"version non précisée")}</span><span class="sub">${Math.round(c.txt.length/1000)} k caractères · ${arts(c).length} articles repérés</span><button class="btn alt" onclick="delL('${c.id}')">Supprimer</button></div>`).join("")||'<div class="empty">Ta bibliothèque est vide. Ajoute ton premier code.</div>')+
 (L().length?`<h2>Chercher</h2><input id="qs" placeholder="N° d’article ou mots-clés"><button class="btn alt" onclick="qsearch()">Chercher</button>${(QR||[]).map(h=>`<div class="card" style="cursor:default"><b>${esc(h.c.t)} · art. ${esc(h.a.id)}</b><div class="pre">${esc(h.a.txt.slice(0,700))}</div></div>`).join("")}`:"")+
 `<h2>Ajouter un code</h2><input id="lt" placeholder="Ex. : Code du travail du Sénégal"><input id="lj" list="jl" placeholder="Juridiction"><datalist id="jl"><option>Sénégal</option><option>OHADA</option><option>France</option><option>International</option><option>Autre</option></datalist><input id="lv" placeholder="Version ou date (ex. 2023)"><label>Fichier .txt ou .md, ou texte collé</label><input type="file" accept=".txt,.md" onchange="readL(this)"><textarea id="lx" placeholder="Colle le texte du code (« Article … » au début de chaque article)"></textarea><button class="btn" onclick="addL()">Enregistrer</button><p class="sub">Les textes restent dans ton navigateur (environ 5 Mo au total). Pour un gros code, ajoute-le par livre ou par titre.</p>`}
function readL(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("lx").value=r.result;if(!$("lt").value)$("lt").value=f.name.replace(/\.\w+$/,"")};r.readAsText(f)}
function addL(){const c={id:uid(),t:$("lt").value.trim(),j:$("lj").value.trim()||"Autre",v:$("lv").value.trim(),txt:$("lx").value.trim()};
 if(!c.t||c.txt.length<100){msg="Titre et texte (100 caractères minimum) requis.";render();return}
 L().unshift(c);try{localStorage.setItem(K,JSON.stringify(D))}catch(e){L().shift();msg="Stockage plein : ajoute le code par livre ou par titre.";render();return}msg="";render()}
function delL(id){D.L=L().filter(c=>c.id!==id);delete AC[id];sv();render()}
function qsearch(){const q=$("qs").value.trim();if(!q)return;QR=/^[lrd]?\.?\s?\d[\d\-\s\.]*$/i.test(q)?lookup(q,L()):kw(q.split(/\s+/),L(),5);if(!QR.length)msg="Aucun résultat dans ta bibliothèque.";render()}
function chkFrom(id){tab="codes";CS="check";KS="c:"+id;open=null;oc=null;CK=null;render()}
function vCheck(){
 if(!L().length)return '<div class="empty">Ajoute d’abord un code dans la bibliothèque.</div>';
 return `<p class="sub">Vérifie qu’un cours, une notion ou un texte est conforme aux codes de ta bibliothèque, même s’il cite déjà des articles.</p><label>Source à vérifier</label><select id="ks">${D.C.map(c=>`<option value="c:${c.id}" ${KS==="c:"+c.id?"selected":""}>Cours : ${esc(c.t)}</option>`).join("")}${D.N.map(n=>`<option value="n:${n.id}">Notion : ${esc(n.t)}</option>`).join("")}<option value="t">Texte libre (ci-dessous)</option></select><textarea id="kt" placeholder="Texte libre à vérifier (optionnel)"></textarea><label>Codes à utiliser</label>${L().map(c=>`<label class="chk"><input type="checkbox" id="k${c.id}" checked> ${esc(c.t)} (${esc(c.j)}${c.v?", "+esc(c.v):""})</label>`).join("")}<button class="btn" onclick="verif()">Vérifier la conformité</button>`+
 (CK?`<h2>Résultat</h2><div class="msg">${CK.filter(x=>x.v==="conforme").length} conformes · ${CK.filter(x=>x.v==="divergent").length} divergents · ${CK.filter(x=>x.v==="non vérifiable").length} non vérifiables</div>${CK.map(x=>`<div class="card" style="cursor:default"><b class="${x.v==="conforme"?"ok":x.v==="divergent"?"ko":""}">${x.v==="conforme"?"✓ Conforme":x.v==="divergent"?"✗ Divergent":"? Non vérifiable"}${x.art?" · "+esc(x.art):""}</b>${esc(x.c)}<div class="sub">${esc(x.e)}</div></div>`).join("")}<p class="sub">Vérification limitée aux textes de ta bibliothèque. Contrôle la version et la juridiction, et consulte la source officielle avant un examen ou une décision.</p>`:"")}
function verif(){const v=$("ks").value,codes=L().filter(c=>$("k"+c.id)&&$("k"+c.id).checked);KS=v;
 const t=v==="t"?$("kt").value:v[0]==="c"?gC(v.slice(2)).txt:(n=>n.t+"\n"+n.el.join("\n")+"\n"+n.ex)(gN(v.slice(2)));
 if(!codes.length||t.trim().length<30){msg="Choisis un code et une source d’au moins 30 caractères.";render();return}
 run("Vérification de la conformité",async()=>{
  const cl=await ai(`${RULES}\nExtrais du texte jusqu’à 10 affirmations juridiques vérifiables (règles, durées, seuils, délais, conditions, définitions). JSON : [{"c":"affirmation reformulée fidèlement","refs":["articles cités dans le texte, tels qu’écrits"],"mots":["2 à 4 mots-clés distinctifs"]}]\nTEXTE :\n${t.slice(0,9000)}`,true);
  const items=(Array.isArray(cl)?cl:[]).slice(0,10);if(!items.length)throw new Error("aucune affirmation juridique détectée");
  const ctx=items.map((x,i)=>{const ps=[];(x.refs||[]).forEach(r=>lookup(String(r),codes).forEach(h=>ps.push(h)));kw(x.mots||[],codes,2).forEach(h=>{if(!ps.some(p=>p.a===h.a))ps.push(h)});
   return `AFFIRMATION ${i+1} : ${x.c}\nPASSAGES :\n`+(ps.slice(0,3).map(p=>`[${p.c.t} · ${p.c.v||"version non précisée"} · art. ${p.a.id}] ${p.a.txt.slice(0,900)}`).join("\n")||"(aucun passage trouvé dans le recueil)")}).join("\n\n");
  const r=await ai(`${RULES}\nTu vérifies la conformité d’affirmations juridiques UNIQUEMENT à partir des passages du recueil fournis. Si aucun passage ne permet de trancher, le verdict est "non vérifiable" : n’invente jamais un article ni son contenu. Exacte : "conforme". Contredit ou déformé : "divergent". JSON : [{"i":numéro,"v":"conforme" ou "divergent" ou "non vérifiable","art":"référence citée dans les passages, sinon vide","e":"explication courte avec un extrait de moins de 20 mots"}].\n${ctx}`,true);
  CK=items.map((x,i)=>{const y=(Array.isArray(r)?r:[]).find(z=>+z.i===i+1)||{};return{c:x.c,v:["conforme","divergent"].includes(y.v)?y.v:"non vérifiable",art:y.art||"",e:y.e||"Aucun passage exploitable."}})})}

render();
</script>
</body>
</html>
